<svg width="300" height="300" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="300" height="300" fill="#f5f5f0"/>
  
  <!-- Animal silhouette (generic quadruped) -->
  <g transform="translate(150, 120)">
    <!-- Body -->
    <ellipse cx="0" cy="10" rx="60" ry="25" fill="#a0a0a0" opacity="0.6"/>
    
    <!-- Head -->
    <circle cx="-45" cy="-5" r="20" fill="#a0a0a0" opacity="0.6"/>
    
    <!-- Legs -->
    <rect x="-35" y="25" width="8" height="25" fill="#a0a0a0" opacity="0.6"/>
    <rect x="-15" y="25" width="8" height="25" fill="#a0a0a0" opacity="0.6"/>
    <rect x="15" y="25" width="8" height="25" fill="#a0a0a0" opacity="0.6"/>
    <rect x="35" y="25" width="8" height="25" fill="#a0a0a0" opacity="0.6"/>
    
    <!-- Tail -->
    <ellipse cx="55" cy="5" rx="15" ry="6" fill="#a0a0a0" opacity="0.6"/>
    
    <!-- Ears -->
    <ellipse cx="-55" cy="-25" rx="8" ry="15" fill="#a0a0a0" opacity="0.6" transform="rotate(-20 -55 -25)"/>
    <ellipse cx="-35" cy="-25" rx="8" ry="15" fill="#a0a0a0" opacity="0.6" transform="rotate(20 -35 -25)"/>
  </g>
  
  <!-- Text -->
  <text x="150" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#888" opacity="0.8">
    Imagem não disponível
  </text>
</svg> 